name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - run: ./autogen.sh
      - run: ./configure
        env:
          CC: ${{ matrix.cc }}
      - run: make -j$(nproc)
      - run: make check -j$(nproc)
      - if: failure()
        run: cat test-suite.log

  distcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - run: ./autogen.sh && ./configure
      - run: make distcheck

  plain:
    # no autoconf, no automake: only sh, awk and the compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/build-plain.sh check
