name: sanitizers
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - run: ./autogen.sh
      - run: ./configure --enable-sanitizers --with-build-type=debug
      - run: make -j$(nproc)
      - run: make check -j$(nproc)
  poison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - run: ./autogen.sh
      - run: ./configure --enable-poison --with-build-type=debug
      - run: make -j$(nproc)
      - run: make check -j$(nproc)
      - run: sh tests/poison_selftest.sh
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake valgrind
      - run: ./autogen.sh
      - run: ./configure --with-build-type=debug
      - run: make -j$(nproc)
      - run: sh tools/valgrind-check.sh .
